name: Import full-resolution JAHANI assets

on:
  push:
    branches:
      - repair/ui-ux-visual-phase
    paths:
      - .github/workflows/import-fullres-jahani-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/ui-ux-visual-phase

      - name: Download original full-resolution PNG assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://d2ol7oe51mr4n9.cloudfront.net/user_3IPtvQE4Q9PFyTQvy3Qga5fCCJc'
          mkdir -p public/assets/brand public/assets/store public/assets/sagool/stages

          curl -fL "$BASE/f9612984-e72a-4b57-808b-92982ef9ff26.png" -o public/assets/brand/jahani-loading-user.png
          curl -fL "$BASE/2d002f77-63d1-4045-8316-d23e58b5cae7.png" -o public/assets/store/house-premium-showcase.png
          curl -fL "$BASE/93dbf7b4-924f-49a0-8ada-6ab7de15cdf5.png" -o public/assets/store/sagool-premium-showcase.png
          curl -fL "$BASE/f1f7da9e-5a50-4f5d-b52c-c0f4a2501368.png" -o public/assets/store/profile-premium-showcase.png
          curl -fL "$BASE/975eed4c-24e0-4858-99c5-db184ef2cbb0.png" -o public/assets/sagool/stages/01-puppy.png
          curl -fL "$BASE/0136228f-8fca-4fd1-8f2a-a9c4536cd7a4.png" -o public/assets/sagool/stages/02-playful.png
          curl -fL "$BASE/63a104aa-60da-4a67-910e-84d6b35e059e.png" -o public/assets/sagool/stages/03-clever.png
          curl -fL "$BASE/7d18b9b0-7d2c-452a-9899-2db92082a0d1.png" -o public/assets/sagool/stages/04-guardian.png
          curl -fL "$BASE/5f54cb9d-2b2c-482d-9942-4f2c348dbd66.png" -o public/assets/sagool/stages/05-legendary.png

      - name: Verify exact SHA256 hashes
        shell: bash
        run: |
          set -euo pipefail
          echo 'f6339d0d8380ad8094090e893e2b6e10ec1716cc305c788478678ac5930fb463  public/assets/brand/jahani-loading-user.png' | sha256sum -c -
          echo '8ee29dce3b8b1155a0ab0da65f137d0bbd3bf84e758f017da93e5ab9076f39e3  public/assets/store/house-premium-showcase.png' | sha256sum -c -
          echo 'fa19453b21e13350a7c748f7dc682f690a749a2c907e0e1f6e915869aada8aec  public/assets/store/sagool-premium-showcase.png' | sha256sum -c -
          echo '6de521dc59965bb7af4ced35f52907707fe32f53ebb686ac3b31ba01171269c3  public/assets/store/profile-premium-showcase.png' | sha256sum -c -
          echo '6077a7545d3f586f1c96934cce621a55e694432b89093b69a355d41f3bcd1fb3  public/assets/sagool/stages/01-puppy.png' | sha256sum -c -
          echo '49e1511a1d4d8b49a683ec7774068a05b41e2e0544b69a4e15070a081ba22f25  public/assets/sagool/stages/02-playful.png' | sha256sum -c -
          echo '1dfd55c960f4feaee3d6db643a1aaa3a2c1e66adb4abddd4b03e1cf7eedbfe17  public/assets/sagool/stages/03-clever.png' | sha256sum -c -
          echo '02048d8c9407e0984d0def9a12f959818bc38a668026eeb8056bc82a49d370b6  public/assets/sagool/stages/04-guardian.png' | sha256sum -c -
          echo 'ea9c1206637e345e4c89255620873aa0903757c8677efc11a4ab6cebdbb2292b  public/assets/sagool/stages/05-legendary.png' | sha256sum -c -

      - name: Commit original binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/brand/jahani-loading-user.png public/assets/store/*.png public/assets/sagool/stages/*.png
          if git diff --cached --quiet; then
            echo 'No binary asset changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import original full-resolution JAHANI assets'
          git push origin HEAD:repair/ui-ux-visual-phase
